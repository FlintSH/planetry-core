# Restart after changes. Fixed progression: 100 game XP per level, starting at 0.
# Quest/skill plugins award XP through the console: gamexp give Player 25
server-id: survival-1
# Player and staff text lives in lang/en.yml and lang/de.yml (MiniMessage).
# Set a language filename without .yml; use /planetrycore reload for text/language edits.
language: en
storage:
  # file is for ONE server only. For network progress choose mariadb/postgresql
  # on every participating server, with the SAME database and table-prefix.
  type: file
  host: 127.0.0.1
  port: 3306
  database: planetry
  username: planetry
  password: ''
  password-env: PLANETRY_DB_PASSWORD
  table-prefix: planetry_core_
  # require validates the database certificate and hostname. disable is for local tests.
  ssl-mode: require
display:
  xp-bar: true
  refresh-ticks: 20
  # Remote changes become visible within this interval. Never does DB I/O in PAPI.
  data-refresh-ticks: 100
vanilla-experience:
  # Game XP replaces normal progression. Prevent vanilla gains, death losses,
  # mending and XP-cost enchanting/anvil actions. Creative XP-free actions remain available.
  # This does not rewrite Inventory Sync's stored vanilla XP.
  lock: true
rewards:
  money: 150.0
  # Requires Vault AND an economy provider. Missing providers leave rewards queued.
  currency-label: Credits
  # Commands run as console, without a leading slash, once per newly reached level.
  # Tokens: {player}, {uuid}, {level}, {money}. Names are checked before substitution.
  commands: []
  # Example: ['lp user {player} permission set planetry.level.{level} true']
mail:
  # Rank is captured when staff send mail. Requires the matching PAPI expansion.
  # Falls back to a Vault chat prefix/primary group, then fallback-rank.
  rank-placeholder: '%luckperms_prefix%'
  fallback-rank: '<red>Staff'
  # Mail polling and presence heartbeat run every 5 seconds. Crash presence expires after 30s.
hotbar:
  enabled: true
  # Fixed slots 8 and 9. Restore only after Inventory Sync is ready.
  restore-interval-ticks: 20
  activation-cooldown-ticks: 6
  quest-book:
    # Nexo is required. Missing/unknown IDs leave the shortcut unavailable and retry.
    # The Nexo stack supplies its appearance, name, lore and components.
    nexo-id: quest_book
    # Right click; no leading slash. Empty disables the action until configured.
    # Tokens: {player}, {uuid}. executor is player or console.
    command: ''
    executor: player
  novalink:
    nexo-id: novalink
    command: ''
    executor: player
