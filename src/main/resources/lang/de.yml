# MiniMessage-Texte. {Platzhalter} bleiben erhalten und werden sicher eingesetzt.
# Fehlende Einträge verwenden die mitgelieferte Sprache, danach Englisch. Mit /planetrycore reload neu laden.
messages:
  reload-usage: '<gray>/planetrycore reload'
  reload-no-permission: '<red>Du darfst Core-Nachrichten nicht neu laden.'
  reload-success: '<green>Core-Sprachdateien neu geladen ({language}).'
  reload-failed: '<red>Sprachdateien konnten nicht neu geladen werden. Die bisherigen Nachrichten bleiben aktiv; prüfe die Serverkonsole.'
  level: '<light_purple>❕ <gray>Du bist Level <light_purple>{level}<gray>! (<white>{gamexp}<gray>/100 Game XP)'
  hint: '<gray>↪ Verdiene Game XP durch Story-Quests, dein Journal und das Verbessern deiner Fähigkeiten!'
  level-up: '<light_purple>❕ LEVELAUFSTIEG! <gray>Du bist jetzt <light_purple>Level {level}<gray>!'
  reward: '<gray>  ↪ Belohnungen: <gold>{money} {currency} ✦'
  updated: '<green>{player} ist Level {level} ({gamexp}/100 Game XP).'
  no-permission: '<red>Du darfst Game XP nicht verwalten.'
  players-only: '<red>Spieler können /level verwenden. Konsole: /gamexp view <player>.'
  loading: '<gray>Deine Game XP werden geladen. Versuche es gleich erneut.'
  unavailable: '<red>Game XP konnten nicht gespeichert oder geladen werden. Der Erfolg ist nicht bestätigt. Bitte kontaktiere das Team.'
  unknown-player: '<red>Spieler nicht gefunden. Verwende einen Spieler, der diesen Server bereits betreten hat, oder seine UUID.'
  vanilla-xp-locked: '<red>Normale Minecraft-XP sind deaktiviert. Game-Level können hier nicht ausgegeben werden.'
  reward-review-header: '<gray>Zu prüfende Belohnungen: {count}'
  reward-review-entry: '<gray>Level {level}: {state}, Vorgang {claim}, Server {server}'
  reward-ack-console-only: '<red>Belohnungen können nur in der Konsole bestätigt werden. Prüfe zuvor Geld und Befehle.'
  reward-acknowledged: '<green>Belohnung bestätigt. Geld und Befehle wurden nicht wiederholt.'
  invalid-amount: '<red>Verwende eine nicht negative ganze Zahl. Give ist auf 10000 XP begrenzt; das höchste Level ist 1000000.'
  maximum-level: '<red>Diese Änderung überschreitet das höchste Game-Level.'
  gamexp-usage: '<gray>/gamexp give|take|setlevel <player|uuid> <amount>, /gamexp view <player|uuid>'
  reward-usage: '<gray>/gamexp rewardstatus <player|uuid>, Konsole: /gamexp ackreward <player|uuid> <claim-uuid>'
mail:
  notice: '<light_purple>❕ {sender}<gray> hat dir ein Geschenk gesendet!'
  claim-button: '<green><bold>ZUM ABHOLEN KLICKEN'
  claim-hover: '<gray>Hole deine Post mit /mail ab'
  sent: '<green>Post für {count} Spieler gespeichert.'
  sent-command: '<gray>Befehl: <white>{command}'
  empty: '<gray>Du hast keine unabgeholte Post.'
  claimed: '<green>{count} Postsendung(en) abgeholt. Verwende /mail erneut, falls weitere übrig sind.'
  busy: '<gray>Deine Post wird bereits abgeholt.'
  no-permission: '<red>Du darfst keine Post senden.'
  players-only: '<red>Spieler können ihre Post mit /mail abholen.'
  not-ready: '<gray>Warte, bis du am Leben bist und dein Inventar geladen ist. Verwende dann erneut /mail.'
  unknown-player: '<red>Spieler nicht gefunden. Verwende einen Spieler, der einen teilnehmenden Server bereits betreten hat, oder seine UUID.'
  invalid-command: '<red>Verwende einen einzelnen Konsolenbefehl ohne führenden Schrägstrich (höchstens 2048 Zeichen). Platzhalter: {player}, {uuid}.'
  command-unavailable: '<red>Ein Postbefehl ist auf diesem Server nicht verfügbar. Deine Post bleibt gespeichert. Kontaktiere das Team oder hole sie auf dem richtigen Server ab.'
  review: '<red>Eine Postsendung muss vom Team geprüft werden. Sie wird nicht automatisch wiederholt.'
  unavailable: '<red>Der Postspeicher konnte diesen Vorgang nicht bestätigen. Kontaktiere das Team, bevor du das Senden oder Abholen wiederholst.'
  usage: '<gray>/mail'
  send-usage: '<gray>/sendmail player <username|uuid> <command>, /sendmail all <command>'
  review-usage: '<gray>/sendmail status <username|uuid>, Konsole: /sendmail ack <username|uuid> <mail-uuid>'
  ack-console-only: '<red>Post kann nur in der Konsole bestätigt werden. Prüfe zuvor die Auswirkungen des Befehls.'
  review-header: '<gray>Zu prüfende Post: {count} (höchstens 100 Einträge)'
  review-entry: '<gray>Post {id}: {state}, Server {server}, Absender {sender}, Befehl: {command}'
  acknowledged: '<green>Post bestätigt. Kein Befehl wurde wiederholt.'
  sender-console: '<light_purple><bold>PLANETRY'
  sender-player: '{rank} <white>{player}'

