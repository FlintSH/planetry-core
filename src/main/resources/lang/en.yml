# MiniMessage text. Keep {tokens}; inserted values are plain text, never markup.
# Missing entries use this bundled language, then bundled English. Use /planetrycore reload after edits.
messages:
  reload-usage: '<gray>/planetrycore reload'
  reload-no-permission: '<red>You do not have permission to reload Core messages.'
  reload-success: '<green>Core language messages reloaded ({language}).'
  reload-failed: '<red>Language reload failed. Previous messages are still active; check the server console.'
  level: '<light_purple>❕ <gray>You are level <light_purple>{level}<gray>! (<white>{gamexp}<gray>/100 Game XP)'
  hint: '<gray>↪ Earn Game XP by completing Story Quests, completing your Journal & levelling up your Skills!'
  level-up: '<light_purple>❕ LEVEL UP! <gray>You are now <light_purple>Level {level}<gray>!'
  reward: '<gray>  ↪ Rewards: <gold>{money} {currency} ✦'
  updated: '<green>{player} is level {level} ({gamexp}/100 Game XP).'
  no-permission: '<red>You do not have permission to manage game XP.'
  players-only: '<red>Players can use /level. Console: /gamexp view <player>.'
  loading: '<gray>Your game XP is loading. Try again in a moment.'
  unavailable: '<red>Game XP could not be saved or loaded. No success is confirmed. Please contact staff.'
  unknown-player: '<red>Player not found. Use a player who has joined this server or their UUID.'
  vanilla-xp-locked: '<red>Normal Minecraft XP is disabled. Game levels cannot be spent here.'
  reward-review-header: '<gray>Rewards requiring review: {count}'
  reward-review-entry: '<gray>Level {level}: {state}, claim {claim}, server {server}'
  reward-ack-console-only: '<red>Reward acknowledgement is console-only. Check the economy and commands before acknowledging.'
  reward-acknowledged: '<green>Reward acknowledged. No money or commands were repeated.'
  invalid-amount: '<red>Use a nonnegative whole number. Give is limited to 10000 XP; the maximum level is 1000000.'
  maximum-level: '<red>That change exceeds the maximum game level.'
  gamexp-usage: '<gray>/gamexp give|take|setlevel <player|uuid> <amount>, /gamexp view <player|uuid>'
  reward-usage: '<gray>/gamexp rewardstatus <player|uuid>, console: /gamexp ackreward <player|uuid> <claim-uuid>'
mail:
  notice: '<light_purple>❕ {sender}<gray> has sent you a gift!'
  claim-button: '<green><bold>CLICK TO CLAIM'
  claim-hover: '<gray>Claim your mail with /mail'
  sent: '<green>Mail saved for {count} player(s).'
  sent-command: '<gray>Command: <white>{command}'
  empty: '<gray>You have no unclaimed mail.'
  claimed: '<green>Claimed {count} mail item(s). Use /mail again if more remain.'
  busy: '<gray>Your mail is already being claimed.'
  no-permission: '<red>You do not have permission to send mail.'
  players-only: '<red>Players can claim mail with /mail.'
  not-ready: '<gray>Please wait until you are alive and your inventory has loaded, then use /mail again.'
  unknown-player: '<red>Player not found. Use a player who has joined a participating backend, or their UUID.'
  invalid-command: '<red>Use one console command without a leading slash (maximum 2048 characters). Tokens: {player}, {uuid}.'
  command-unavailable: '<red>A mail command is unavailable on this backend. Your mail is still saved; contact staff or claim on the correct server.'
  review: '<red>A mail item needs staff review. It will not be repeated automatically.'
  unavailable: '<red>Mail storage could not confirm this operation. Contact staff before repeating a send or claim.'
  usage: '<gray>/mail'
  send-usage: '<gray>/sendmail player <username|uuid> <command>, /sendmail all <command>'
  review-usage: '<gray>/sendmail status <username|uuid>, console: /sendmail ack <username|uuid> <mail-uuid>'
  ack-console-only: '<red>Mail acknowledgement is console-only. Check the command''s effects before acknowledging.'
  review-header: '<gray>Mail requiring review: {count} (up to 100 shown)'
  review-entry: '<gray>Mail {id}: {state}, server {server}, sender {sender}, command: {command}'
  acknowledged: '<green>Mail acknowledged. No command was repeated.'
  sender-console: '<light_purple><bold>PLANETRY'
  sender-player: '{rank} <white>{player}'
