name: Test and release
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Paper 26.1.2 / file + PostgreSQL 17 + MariaDB 10.11 / Java 25
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: planetry_core_test
          POSTGRES_USER: planetry
          POSTGRES_PASSWORD: core-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U planetry -d planetry_core_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: planetry_core_test
          MARIADB_USER: planetry
          MARIADB_PASSWORD: core-test-only
          MARIADB_ROOT_PASSWORD: root-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CORE_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/planetry_core_test
      CORE_TEST_POSTGRES_USER: planetry
      CORE_TEST_POSTGRES_PASSWORD: core-test-only
      CORE_TEST_MARIADB_URL: jdbc:mariadb://127.0.0.1:3306/planetry_core_test
      CORE_TEST_MARIADB_USER: planetry
      CORE_TEST_MARIADB_PASSWORD: core-test-only
      CORE_TEST_DATABASE: planetry_core_test
      CORE_TEST_USER: planetry
      CORE_TEST_PASSWORD: core-test-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set commit version
        run: mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="1.0.${GITHUB_RUN_NUMBER}" -DgenerateBackupPoms=false
      - name: Unit, durability and both real database integration suites
        run: mvn -B -ntp clean verify dependency:build-classpath -Dmdep.outputFile=target/test-classpath.txt
      - name: Real Paper, file storage, PlaceholderAPI and economy probe
        run: python3 scripts/smoke.py "target/planetry-core-1.0.${GITHUB_RUN_NUMBER}.jar"
      - name: Real Paper without optional plugins
        run: python3 scripts/smoke.py "target/planetry-core-1.0.${GITHUB_RUN_NUMBER}.jar" --without-hooks
      - name: Real Paper and packaged PostgreSQL driver probe
        env:
          CORE_TEST_TYPE: postgresql
          CORE_TEST_PORT: '5432'
        run: python3 scripts/smoke.py "target/planetry-core-1.0.${GITHUB_RUN_NUMBER}.jar"
      - name: Real Paper and packaged MariaDB driver probe
        env:
          CORE_TEST_TYPE: mariadb
          CORE_TEST_PORT: '3306'
        run: python3 scripts/smoke.py "target/planetry-core-1.0.${GITHUB_RUN_NUMBER}.jar"
      - name: Real Paper mail commands and offline delivery
        run: python3 scripts/smoke.py "target/planetry-core-1.0.${GITHUB_RUN_NUMBER}.jar" --mail
      - name: Real Paper mail without optional plugins
        run: python3 scripts/smoke.py "target/planetry-core-1.0.${GITHUB_RUN_NUMBER}.jar" --mail --without-hooks
      - name: Real Paper shared PostgreSQL mail
        env:
          CORE_TEST_TYPE: postgresql
          CORE_TEST_PORT: '5432'
        run: python3 scripts/smoke.py "target/planetry-core-1.0.${GITHUB_RUN_NUMBER}.jar" --mail
      - name: Real Paper shared MariaDB mail
        env:
          CORE_TEST_TYPE: mariadb
          CORE_TEST_PORT: '3306'
        run: python3 scripts/smoke.py "target/planetry-core-1.0.${GITHUB_RUN_NUMBER}.jar" --mail
      - name: Real Paper locked hotbar, Nexo API fixture and readiness
        run: python3 scripts/smoke.py "target/planetry-core-1.0.${GITHUB_RUN_NUMBER}.jar" --hotbar
      - name: Real Paper locked hotbar without optional plugins
        run: python3 scripts/smoke.py "target/planetry-core-1.0.${GITHUB_RUN_NUMBER}.jar" --hotbar --without-hooks
      - name: Real Paper hotbar with packaged PostgreSQL driver
        env:
          CORE_TEST_TYPE: postgresql
          CORE_TEST_PORT: '5432'
        run: python3 scripts/smoke.py "target/planetry-core-1.0.${GITHUB_RUN_NUMBER}.jar" --hotbar
      - name: Real Paper hotbar with packaged MariaDB driver
        env:
          CORE_TEST_TYPE: mariadb
          CORE_TEST_PORT: '3306'
        run: python3 scripts/smoke.py "target/planetry-core-1.0.${GITHUB_RUN_NUMBER}.jar" --hotbar
      - name: Checksum tested artifacts
        working-directory: target
        run: sha256sum planetry-core-*.jar mariadb-java-client-*-sources.jar > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: planetry-core-${{ github.run_number }}
          path: |
            target/planetry-core-*.jar
            target/mariadb-java-client-*-sources.jar
            target/SHA256SUMS
  release:
    name: Publish tested commit release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: planetry-core-${{ github.run_number }}
          path: target
      - name: Verify tested artifact checksum
        working-directory: target
        run: sha256sum -c SHA256SUMS
      - name: Publish exact tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "PlanetryCore 1.0.${GITHUB_RUN_NUMBER}" --prerelease --generate-notes
          fi
          gh release upload "$tag" target/planetry-core-*.jar target/mariadb-java-client-*-sources.jar target/SHA256SUMS --clobber
